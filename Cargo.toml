[package]
name = "sbk"
version = "0.3.1"
edition = "2024"
authors = ["MelanX"]
license = "MIT"
description = "Fast, format-aware archiver for Minecraft worlds — preprocesses MCA, NBT, and JSON files before LZMA2/ZSTD solid compression"
repository = "https://github.com/ChaoticTrials/sbk"
keywords = ["minecraft", "compression", "archive", "mca"]
categories = ["command-line-utilities", "compression", "filesystem"]
readme = "README.md"

[lib]
name = "sbk"
path = "src/lib.rs"

[[bin]]
name = "sbk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
xz2 = "0.1"
zstd = "0.13"
flate2 = "1"
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
rayon = "1"
walkdir = "2"
filetime = "0.2"
glob = "0.3"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
indicatif = "0.18"
anyhow = "1"
thiserror = "2"
zip = "8.5.0"
tar = "0.4"
time = "0.3"
tempfile = "3"

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"
